name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 33, 36]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # 新的 cmdline-tools 里已经没有 tools 这个包，action 的默认值会让整步失败。
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit lifecycle regressions
        if: matrix.api == 36
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android ${{ matrix.api }} return paths
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/device-regressions.sh
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-regression-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/ui-checks/
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  build:
    if: github.repository == 'Ling-LA/IwaraFlow' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode private release keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.IWARAFLOW_RELEASE_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.IWARAFLOW_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_B64"
          test -n "$SIGNING_STORE_PASSWORD"
          umask 077
          mkdir -p "$RUNNER_TEMP/iwaraflow-signing"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iwaraflow-signing/release.p12"
          keytool -list -keystore "$RUNNER_TEMP/iwaraflow-signing/release.p12" -storepass:env SIGNING_STORE_PASSWORD -alias iwaraflow-release >/dev/null

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Sign APK with private rotated key
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.IWARAFLOW_RELEASE_STORE_PASSWORD }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*unsigned*.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          fi
          test -n "$UNSIGNED_APK"
          mkdir -p out
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/iwaraflow-signing/release.p12" \
            --ks-key-alias iwaraflow-release \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --lineage signing/release.lineage \
            --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false \
            --out out/IwaraFlow-signed.apk \
            "$UNSIGNED_APK"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs out/IwaraFlow-signed.apk | tee out/signature-verification.txt
          grep -F "Signer #1 certificate SHA-256 digest: $(cat signing/release-cert.sha256)" out/signature-verification.txt
          ! grep -F '9908162dd47eb6dd815fa2ff1e16cdad8858dff4a54ee685e764d3481c2d8660' out/signature-verification.txt

      - name: Remove temporary private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/iwaraflow-signing/release.p12"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IwaraFlow-signed-APK
          path: out/IwaraFlow-signed.apk
          if-no-files-found: error

  signing-upgrade:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [28, 33, 36]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v4
        with:
          name: IwaraFlow-signed-APK
          path: out
      - name: Prepare previous release and negative signing fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          yes | sdkmanager "build-tools;36.0.0" >/dev/null || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          gh release download v0.16.9 --repo Ling-LA/IwaraFlow --pattern IwaraFlow-signed.apk --dir previous
          echo '72f1f74b442dfe90726554f9497b2e3a51e131ceffa5c7512a9a85f42a324c36  previous/IwaraFlow-signed.apk' | sha256sum -c -
          # Public historical key is used ONLY to prove an old-key replacement is rejected.
          git show 5f03b4fb868070cf5c528894938488a18fbfedfe:signing/iwaraflow-dev.jks.b64 | base64 -d > "$RUNNER_TEMP/legacy-test.jks"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/legacy-test.jks" --ks-key-alias iwaraflow --ks-pass pass:iwaraflow --out "$RUNNER_TEMP/legacy-test.apk" out/IwaraFlow-signed.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed upgrade preserves data and rejects the old key
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/signing-upgrade-regressions.sh

  publish:
    needs: [navigation, build, signing-upgrade]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: IwaraFlow-signed-APK
          path: out
      - name: Publish GitHub Release (versions are immutable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          TAG="v$VERSION"
          NOTES="release-notes/$TAG.md"
          test -s "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，请提升版本号；已发布的 APK 不可覆盖。"
            exit 1
          fi
          gh release create "$TAG" out/IwaraFlow-signed.apk \
            --target "$GITHUB_SHA" --title "IwaraFlow $TAG" --notes-file "$NOTES"
