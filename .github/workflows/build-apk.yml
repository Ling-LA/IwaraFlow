name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit lifecycle regressions
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 return paths
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put system screen_off_timeout 1800000
            gradle :app:connectedDebugAndroidTest --no-daemon
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.backMode=key --no-daemon
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-regression-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  build:
    needs: navigation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode fixed signing keystore
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/iwaraflow-signing"
          base64 -d signing/iwaraflow-dev.jks.b64 > "$RUNNER_TEMP/iwaraflow-signing/iwaraflow-dev.jks"
          keytool -list -keystore "$RUNNER_TEMP/iwaraflow-signing/iwaraflow-dev.jks" -storepass iwaraflow -alias iwaraflow >/dev/null

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Sign APK with fixed key
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*unsigned*.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          fi
          test -n "$UNSIGNED_APK"
          mkdir -p out
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/iwaraflow-signing/iwaraflow-dev.jks" \
            --ks-key-alias iwaraflow \
            --ks-pass pass:iwaraflow \
            --key-pass pass:iwaraflow \
            --out out/IwaraFlow-signed.apk \
            "$UNSIGNED_APK"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs out/IwaraFlow-signed.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IwaraFlow-signed-APK
          path: out/IwaraFlow-signed.apk
          if-no-files-found: error

      - name: Publish or refresh GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          TAG="v$VERSION"
          NOTES=$(cat <<EOF
          IwaraFlow $TAG

          此 Release 由 main 分支的固定签名构建自动发布。
          App 内“检查更新”会读取此 Release 并下载安装 IwaraFlow-signed.apk。

          Commit: $GITHUB_SHA
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/IwaraFlow-signed.apk --clobber
            gh release edit "$TAG" --title "IwaraFlow $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" out/IwaraFlow-signed.apk \
              --target "$GITHUB_SHA" \
              --title "IwaraFlow $TAG" \
              --notes "$NOTES"
          fi
