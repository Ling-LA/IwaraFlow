name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed installable APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Collect installable APK
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/IwaraFlow-signed.apk
          ls -lh out/IwaraFlow-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: IwaraFlow-signed-APK
          path: out/IwaraFlow-signed.apk
          if-no-files-found: error
