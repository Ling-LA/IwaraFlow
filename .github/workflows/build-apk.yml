name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/IwaraFlow-debug.apk
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" out/IwaraFlow-release.apk
          fi
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: IwaraFlow-APK
          path: out/*.apk
          if-no-files-found: error
