name: Clean old builds

on:
  workflow_run:
    workflows: [Build APK]
    types: [completed]
  schedule:
    # Daily at 03:17 China Standard Time; also catches interrupted cleanup runs.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list old runs without deleting them
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-actions
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'Ling-LA/IwaraFlow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run can be triggered by a fork PR. Only run trusted default-branch
      # code, never the triggering commit, its artifacts, or its caches.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test retention policy
        run: python3 -m unittest discover -s scripts -p 'test_cleanup_actions.py' -v
      - name: Keep the latest 50 APK builds
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python3 scripts/cleanup_actions.py
